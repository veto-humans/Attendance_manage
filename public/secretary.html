<!DOCTYPE html>
<html lang="zh-Hant">

  <head>
    <title>幹事統計面板 - 出缺席填報系統</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet" />
    <!-- Use unified manager stylesheet for consistent layout -->
    <link rel="stylesheet" href="/manager.css" />
    <link rel="shortcut icon" href="/attendance_web_icon.png"/>
    <script src="/secretary.js" defer></script>
  </head>

  <body class="gjs-t-body font-body page-body">
    <div class="page-shell">
      <header class="top-header">
        <div class="header-container">
          <div class="brand-block">
            <div class="brand-icon">
              <img src="https://api.iconify.design/lucide-clipboard-check.svg?color=%2310b981" alt="統計圖示" class="brand-icon-image" />
            </div>
            <div class="brand-text">
              <p class="header-eyebrow">Attendance Dashboard</p>
              <h1 class="gjs-t-h1 font-heading header-title">幹事統計面板</h1>
            </div>
          </div>
          <div class="header-actions">
            <a href="/" class="gjs-t-link home-link">返回首頁</a>
          </div>
        </div>
      </header>

      <main class="main-content">
        <section class="dashboard-section">
          <div class="glass-card soft-shadow hero-card">
            <div class="hero-content">
              <div class="hero-top">
                <div class="hero-intro">
                  <div class="status-pills">
                    <span class="status-pill">全校班級彙整</span>
                    <span class="status-pill">填報狀態統計</span>
                  </div>
                  <div class="hero-title-group">
                    <h2 class="font-heading hero-title">全校班級填報確認狀態</h2>
                    <p class="hero-description">此頁面提供全校班級填報狀態統計。僅顯示班級填報結果，不會揭露學生人數與請假事由。</p>
                    <button type="button" class="gjs-t-button submit-button" id="sync-firestore-button">同步 Google Sheet 到資料庫</button>
                    <p class="hero-note" id="sync-status">按下按鈕以從 Google Sheet 取得最新使用者與班級資料。</p>
                  </div>
                </div>
                <div class="hero-side-note">
                  <span class="side-note-label">查詢日期</span>
                  <strong class="font-heading side-note-date" id="iak2fo">-- / -- / --</strong>
                  <span class="side-note-subtext" id="iz56oh">更新時間 --:--</span>
                </div>
              </div>
            </div>
          </div>

          <div class="summary-grid">
            <div class="glass-card summary-card">
              <div class="summary-header">
                <img src="https://api.iconify.design/lucide-school.svg?color=%231d4ed8" alt="班級圖示" class="summary-icon" />
                <span class="summary-label">已填報班級</span>
              </div>
              <strong id="ibpj1z" class="font-heading summary-value">0</strong>
              <p class="summary-note">班級已填報</p>
            </div>
            <div class="glass-card summary-card">
              <div class="summary-header">
                <img src="https://api.iconify.design/lucide-clock-3.svg?color=%23d97706" alt="待確認圖示" class="summary-icon" />
                <span class="summary-label">待填報班級</span>
              </div>
              <strong id="ix56n3" class="font-heading summary-value">0</strong>
              <p class="summary-note">班級未填報</p>
            </div>
            <div class="glass-card summary-card">
              <div class="summary-header">
                <img src="https://api.iconify.design/lucide-check-circle-2.svg?color=%239333ea" alt="已確認圖示" class="summary-icon" />
                <span class="summary-label">已確認班級</span>
              </div>
              <strong id="ix66n3" class="font-heading summary-value">0</strong>
              <p class="summary-note">導師已確認</p>
            </div>
          </div>

          <section class="content-grid">
            <div class="class-list-section">
              <div id="secretary-class-list"></div>
              <div id="secretary-empty-state" class="empty-state"></div>
            </div>
          </section>

        </section>
      </main>

      <footer class="footer">
        <div class="footer-container">
          <p>出缺席填報系統｜幹事統計面板</p>
          <div class="footer-links">
            <span>問題回報：s122222@yfms.tyc.edu.tw</span>
          </div>
        </div>
      </footer>
    </div>
  </body>

</html>
