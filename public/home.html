<!DOCTYPE html>
<html lang="zh-Hant">

  <head>
    <title>登錄頁面</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index,follow">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/home.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script>
      window.FIREBASE_CONFIG = {
        apiKey: '',
        authDomain: '',
        projectId: '',
        appId: '',
        messagingSenderId: '',
        measurementId: ''
      };
    </script>
  </head>

  <body class="font-body login-bg">
    <main class="login-page">
      <section class="login-section">
        <div class="login-layout">
          <div class="login-form-panel">
            <div class="form-header">
              <h2 class="font-heading form-title">帳戶登錄</h2>
              <p class="form-subtitle">
                請使用 Google 帳號進行登入。
              </p>
            </div>
            <form method="post" action="#" class="login-form">
              <div class="input-group">
                <label for="email" class="input-label">電子郵件</label>
                <div class="input-wrapper">
                  <img src="https://api.iconify.design/lucide-mail.svg?color=%2364748b" alt="電子郵件" class="input-icon" />
                  <input type="email" id="email" name="email" placeholder="you@yfms.tyc.edu.tw" aria-label="電子郵件" class="email-input" />
                </div>
              </div>
              <div class="input-group">
                <label for="password" class="input-label">密碼</label>
                <div class="input-wrapper">
                  <img src="https://api.iconify.design/lucide-key-round.svg?color=%2364748b" alt="密碼" class="input-icon" />
                  <input type="password" id="password" name="password" placeholder="請輸入密碼" aria-label="密碼" class="password-input" />
                </div>
              </div>
              <div class="form-options">
                <label class="checkbox-label">
                  <input type="checkbox" aria-label="記住我" class="remember-checkbox" id="rememberMe" />
                  <span class="checkbox-text">記住我</span>
                </label>
                <a href="#" class="forgot-password-link" id="forgot-password-link">忘記密碼？</a>
              </div>
              <button type="submit" class="submit-button" id="login-submit-button">
                登錄
              </button>
            </form>
            <div class="separator">或</div>
            <button type="button" class="submit-button" id="google-signin-button">
              使用 Google 帳號登入
            </button>
            <p class="login-note" id="login-note">若帳號尚未授權，請聯絡管理員建立使用者資料。</p>
            
          </div>
        </div>
      </section>
      <footer class="footer">
        <div class="footer-container">
          <p class="company-name">問題回報：s122222@yfms.tyc.edu.tw</p>
        </div>
      </footer>
    </main>
    <script src="/main.js"></script>
  </body>

</html>
